room = "2.6.1"
coroutines = "1.10.1"
serializationJson = "1.8.0"
securityCrypto = "1.1.0-alpha06"
conscrypt = "2.5.3"
bouncycastle = "1.79"
junit4 = "4.13.2"
truth = "1.4.4"
turbine = "1.2.0"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
