name: Boost12 Android CI & APK Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests, Compose Smoke Tests & Build Debug APK (v1.0, Debugger Mode ON)
        if: hashFiles('app/src/main/java/**/*.kt') != ''
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintDebug assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Boost12-v1.0-debug.apk

      - name: Report JUnit Failures as Annotations
        if: failure()
        run: |
          python3 - << 'EOF'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              tree = ET.parse(path)
              for tc in tree.findall('.//testcase'):
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fail.attrib.get('message') or fail.text or 'Test failed').replace('\n', ' ')[:500]
                      print(f"::error title={tc.attrib.get('classname')}.{tc.attrib.get('name')}::{msg}")
          EOF

      - name: Upload Test & Lint Reports
        if: always() && hashFiles('app/build/reports/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: app/build/reports/

      - name: Upload Boost12 v1.0 Debug APK Artifact
        if: hashFiles('Boost12-v1.0-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Boost12-v1.0-debug-apk
          path: Boost12-v1.0-debug.apk

      - name: Publish Boost12 v1.0 APK Release (Debugger Mode ON)
        if: success() && hashFiles('Boost12-v1.0-debug.apk') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA256=$(sha256sum Boost12-v1.0-debug.apk | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s Boost12-v1.0-debug.apk)
          cat << NOTES > release-notes.md
          ## Boost12 v1.0 — First Android APK Release (Debugger Mode ON)

          **Target Device Profile:** Xiaomi Redmi 12 4G (\`22041219NY\` family · Snapdragon 685 \`SM6225\` · Adreno 610 · 8 GB RAM / 256 GB Storage · 90 Hz Display · MIUI / HyperOS Android 13–15)

          ### Build Metadata
          - **Application ID:** \`com.boost12.rd12\`
          - **Version:** \`1.0\` (\`versionCode = 1\`)
          - **Build Mode:** Debuggable APK (\`isDebuggable = true\`, in-app **ADB Verbose Debugger Mode** enabled by default)
          - **Min / Target SDK:** \`31\` / \`35\`
          - **Artifact:** \`Boost12-v1.0-debug.apk\` (\`${SIZE_BYTES}\` bytes)
          - **SHA-256:** \`${SHA256}\`

          ### Highlights
          - Embedded pure-Kotlin **ADB-over-Wi-Fi** client (\`TLSv1.3\` + BoringSSL-compatible \`SPAKE2+\` 6-digit pairing + \`mDNS\` auto-discovery + \`EncryptedSharedPreferences\` one-tap reconnect)
          - **Real-time verified toggles (38 built-in cards)** across Display (90 Hz, 0x/0.5x animations, 440 DPI, Game Turbo), CPU, GPU (ANGLE, SkiaVK, HW overlays), **#Alice ActivityManager & Phantom Process Suite** (\`set_sync_disabled_for_tests persistent\`, \`max_cached_processes 512\` & \`108096\`, \`max_phantom_processes 2147483647\`, \`settings_enable_monitor_phantom_procs false\`, \`max_empty_time_millis 43200000\`, \`use_compaction true\`, \`activity_manager_native_boot use_freezer true\`), **Memory & Background Process** (\`ram_expand_size 0\`, \`zram_enabled 1\`, \`cached_apps_freezer enabled\`, \`app_standby_enabled 1\`, \`app_restriction_enabled true\`, \`background_process_limit 4\`, \`intelligent_sleep_mode 0\`, \`fstrim\`, 1 GB cache trim, \`Doze\`, \`appops\`), Network (\`netpolicy\`, Wi-Fi low-latency), and **Custom ADB Shell** cards
          - Room-persisted **Change History** with one-tap **Revert All** and hard-blocked destructive command protection
          NOTES

          if gh release view v1.0 >/dev/null 2>&1; then
            gh release upload v1.0 Boost12-v1.0-debug.apk --clobber
            gh release edit v1.0 --title "Boost12 v1.0 (Debug APK — Debugger Mode ON)" --notes-file release-notes.md
          else
            gh release create v1.0 Boost12-v1.0-debug.apk \
              --target "${{ github.sha }}" \
              --title "Boost12 v1.0 (Debug APK — Debugger Mode ON)" \
              --notes-file release-notes.md
          fi
